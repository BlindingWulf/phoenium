plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.2 is supplied to Loom as an already official-named, non-obfuscated artifact.
    // Calling officialMojangMappings() is rejected by Loom 1.17.20 in that environment.
    // Loom's non-obfuscated 26.2 mode does not create remap configurations.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    clientGameTest {
        java.srcDir 'src/clientGameTest/java'
        resources.srcDir 'src/clientGameTest/resources'

        // The client harness may inspect the live Phoenium runtime, but its output is
        // deliberately kept out of the main source set and therefore out of the
        // production server-only JAR.
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    clientGameTestImplementation.extendsFrom implementation
    clientGameTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('processClientGameTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// The isolated verification checkout may use the preserved prepared runtime from
// the sibling full-luna checkout; never generate or modify that source in place.
def stage3ServerBase = file('.stage2-server-live1').exists()
        ? file('.stage2-server-live1')
        : file('../Phoenium-full-luna/.stage2-server-live1')

def stage4FrozenSha256 = '017EE8ED612D238894FFA5A1DC019BA8B0E31124B0B5171D08CC0D8993C1B534'
def stage4Sha256 = { File source ->
    if (!source.isFile()) throw new GradleException("Missing production artifact: ${source}")
    def digest = java.security.MessageDigest.getInstance('SHA-256')
    source.withInputStream { input ->
        byte[] buffer = new byte[1024 * 1024]
        int count
        while ((count = input.read(buffer)) >= 0) if (count > 0) digest.update(buffer, 0, count)
    }
    digest.digest().encodeHex().toString().toUpperCase(java.util.Locale.ROOT)
}
def stage4SelectedProduction = providers.provider {
    boolean reference = providers.gradleProperty('stage4Reference').orElse('false').get().toBoolean()
    def frozen = providers.gradleProperty('stage4ReferenceProduction').orNull
    if (reference != (frozen != null))
        throw new GradleException('Reference mode requires stage4Reference=true AND stage4ReferenceProduction; candidate mode allows neither reference input.')
    reference ? file(frozen) : tasks.named('jar').get().archiveFile.get().asFile
}
def stage4ExpectedSha256 = {
    def actual = stage4Sha256(stage4SelectedProduction.get())
    if (providers.gradleProperty('stage4Reference').orElse('false').get().toBoolean()
            && actual != stage4FrozenSha256)
        throw new GradleException("Frozen Stage 3 source hash mismatch: expected ${stage4FrozenSha256}, got ${actual}")
    actual
}

tasks.register('prepareStage3ClientServer', Sync) {
    description = 'Prepare an ignored, disposable external Fabric server for Stage 3 client evidence.'
    group = 'verification'
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('stage3-client-server')
    from(stage3ServerBase) {
        include 'fabric-server-launch.jar'
        include '.fabric/**'
        include 'libraries/**'
        include 'versions/**'
        include 'mods/fabric-api-base.jar'
        include 'mods/fabric-lifecycle-events-v1.jar'
    }
    from(configurations.runtimeClasspath) {
        include '*fabric-command-api-v2*.jar'
        into 'mods'
    }
    from(tasks.named('jar')) {
        into 'mods'
    }
}

tasks.register('prepareStage4ClientServer', Sync) {
    description = 'Prepare a disposable installed Stage 4 server with the account-free trace probe.'
    group = 'verification'
    dependsOn tasks.named('prepareStage3ClientServer'), tasks.named('stage4AcceptanceHarness')
    def serverDirectory = providers.gradleProperty('stage4ServerDirectory')
            .orElse(layout.buildDirectory.dir('stage4-client-server')
            .map { it.asFile.absolutePath })
    inputs.property('stage4ServerDirectory', serverDirectory)
    inputs.property('stage4ReferenceProduction', providers.gradleProperty('stage4ReferenceProduction').orElse(''))
    into serverDirectory.map { file(it) }
    from(tasks.named('prepareStage3ClientServer')) {
        exclude 'mods/phoenium-*.jar', 'mods/full-live-probe.jar', 'mods/full-registration-probe.jar'
    }
    from(stage4SelectedProduction) {
        into 'mods'
        rename { 'phoenium-0.2.0-stage2.jar' }
    }
    from(tasks.named('stage4AcceptanceHarness')) { into 'mods' }
    doFirst { stage4ExpectedSha256() }
}

// Verify even when Sync was up to date, before the client and both child servers launch.
tasks.register('verifyStage4ClientServerProduction') {
    dependsOn tasks.named('prepareStage4ClientServer')
    doLast {
        def targetDirectory = providers.gradleProperty('stage4ServerDirectory')
                .orElse(layout.buildDirectory.dir('stage4-client-server').map { it.asFile.absolutePath }).get()
        def installed = file(targetDirectory).toPath().resolve('mods/phoenium-0.2.0-stage2.jar').toFile()
        def expected = stage4ExpectedSha256()
        def actual = stage4Sha256(installed)
        if (actual != expected) throw new GradleException("Installed Stage 4 production mismatch: expected ${expected}, got ${actual}")
        logger.lifecycle("STAGE4_PRODUCTION_VERIFIED sha256=${actual} installed=${installed.absolutePath}")
    }
}

loom {
    runs {
        clientGameTest {
            client()
            name 'Phoenium Client GameTest'
            source sourceSets.clientGameTest
            runDir 'run/client-gametest'

            // Fabric Client GameTest is opt-in and discovers the isolated harness
            // entrypoint through the official fabric-client-gametest key.
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'

            // Development identity only. The dedicated test server is offline/local
            // and never consults a Microsoft account or launcher profile.
            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runClientGameTest'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/HARNESS-SMOKE-01.json').get().asFile.absolutePath
        }

        stage3ClientGameTest {
            client()
            name 'Phoenium Stage 3 Client GameTest'
            source sourceSets.clientGameTest
            runDir 'run/stage3-client-gametest'

            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=stage3'

            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3ClientGameTest'
            property 'phoenium.test.serverDirectory',
                    layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CLIENT.json').get().asFile.absolutePath
        }

        stage4ClientGameTest {
            client()
            name 'Phoenium Stage 4 account-free client trace'
            source sourceSets.clientGameTest
            runDir 'run/stage4-client-gametest'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=stage4client'
            programArg '--username'
            programArg 'PhoeniumTest0'
            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage4ClientGameTest'
            property 'phoenium.stage4.viewDistance', providers.gradleProperty('stage4ViewDistance').orElse('8').get()
            property 'phoenium.stage4.simulationDistance', providers.gradleProperty('stage4SimulationDistance').orElse('8').get()
            // Explicitly select the frozen serial reference for comparator runs;
            // the child server receives this through the client JVM property.
            vmArg "-Dphoenium.stage4.reference=${providers.gradleProperty('stage4Reference').orElse('false').get()}"
            vmArg "-Dphoenium.stage4.packetTrace=${providers.gradleProperty('stage4PacketTrace').orElse('false').get()}"
            def stage4RunId = providers.gradleProperty('stage4RunId').orElse('current').get()
            def stage4EvidenceDir = providers.gradleProperty('stage4EvidenceDir')
                    .orElse(layout.buildDirectory.dir('stage4-client-gametest/evidence/' + stage4RunId)
                    .map { it.asFile.absolutePath }).get()
            if (providers.gradleProperty('stage4PacketTrace').orElse('false').get().toBoolean())
                vmArg "-Dphoenium.stage4.packetTracePath=${file(stage4EvidenceDir).toPath().resolve('client-packets.log').toFile().absolutePath}"
            def stage4ServerDirectory = providers.gradleProperty('stage4ServerDirectory')
                    .orElse(layout.buildDirectory.dir('stage4-client-server')
                    .map { it.asFile.absolutePath }).get()
            property 'phoenium.stage4.runId', stage4RunId
            property 'phoenium.test.serverDirectory', file(stage4ServerDirectory).absolutePath
            property 'phoenium.stage4.tracePath',
                    file(stage4EvidenceDir).toPath().resolve('STAGE4-CLIENT-trace.json').toFile().absolutePath
            property 'phoenium.client.gametest.evidence',
                    file(stage4EvidenceDir).toPath().resolve('STAGE4-CLIENT.json').toFile().absolutePath
        }

        stage3FullAcceptance {
            client()
            name 'Phoenium authoritative FULL real-client acceptance'
            source sourceSets.clientGameTest
            runDir 'run/full-client-gametest'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=fullacceptance'
            programArg '--username'
            programArg 'PhoeniumTest0'
            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3FullAcceptance'
            property 'phoenium.test.serverDirectory', layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
        }

        stage3ChunkTrace {
            client()
            name 'Phoenium Stage 3 Chunk Runtime Trace'
            source sourceSets.clientGameTest
            runDir 'run/stage3-chunk-trace'

            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=chunktrace'

            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3ChunkTrace'
            property 'phoenium.test.serverDirectory',
                    layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-RUNTIME.json').get().asFile.absolutePath
            property 'phoenium.client.gametest.chunkTraceEvidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-RUNTIME.json').get().asFile.absolutePath
        }

        stage3ChunkReadinessTrace {
            client()
            name 'Phoenium Stage 3 Chunk Readiness Trace'
            source sourceSets.clientGameTest
            runDir 'run/stage3-chunk-readiness-trace'

            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=chunkreadiness'

            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3ChunkReadinessTrace'
            property 'phoenium.test.serverDirectory',
                    layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-READINESS.json').get().asFile.absolutePath
            property 'phoenium.client.gametest.chunkReadinessEvidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-READINESS.json').get().asFile.absolutePath
        }
    }
}

tasks.named('runStage3ClientGameTest') {
    dependsOn tasks.named('prepareStage3ClientServer')
}

tasks.named('runStage4ClientGameTest') {
    dependsOn tasks.named('verifyStage4ClientServerProduction')
    doFirst { systemProperty 'phoenium.stage4.expectedProductionSha256', stage4ExpectedSha256() }
}

tasks.named('runStage3ChunkTrace') {
    dependsOn tasks.named('prepareStage3ClientServer')
}

tasks.named('runStage3ChunkReadinessTrace') {
    dependsOn tasks.named('prepareStage3ClientServer')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Test-only adapter plumbing on original Minecraft classes, excluded from the production JAR.
def fullRegistrationTestAgent = tasks.register('fullRegistrationTestAgent', Jar) {
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'full-registration-test-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('test-agent')
    from(sourceSets.test.output.classesDirs) { include '**/FullRegistrationTestAgent*.class' }
    manifest { attributes 'Premain-Class': 'dev.phoenium.chunk.FullRegistrationTestAgent' }
}
tasks.named('test') {
    dependsOn fullRegistrationTestAgent
    jvmArgumentProviders.add({ ["-javaagent:${fullRegistrationTestAgent.get().archiveFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
}

tasks.register('fullRegistrationHarness', Jar) {
    description = 'Build a disposable server-only registration fixture; never included in the production artifact.'
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'full-registration-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.test.output.classesDirs) { exclude '**/FullRegistrationTestAgent*.class', '**/FullRegistrationTestTransform*.class' }
    from('src/testHarness/resources')
    from({ configurations.testRuntimeClasspath.findAll {
        it.name.startsWith('junit-') || it.name.startsWith('opentest4j-') || it.name.startsWith('apiguardian-')
    }.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
}

tasks.register('adverseStopHarness', Jar) {
    description = 'Build the disposable native pending-write / failed-stop probe.'
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'stage4-adverse-stop-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.test.output.classesDirs) {
        include 'dev/phoenium/adversestop/**'
        exclude '**/*Test.class', '**/*Test$*.class'
    }
    from('src/adverseStopHarness/resources')
}

// The controlled installed probe is copied from the prepared server tree by
// test_full_boundary_transform.py. Build it whenever that tree is prepared so
// a source change cannot leave an older probe beside the current production JAR.
tasks.named('prepareStage3ClientServer') {
    dependsOn tasks.named('fullRegistrationHarness')
}
tasks.register('fullAcceptanceHarness', Jar) {
    description = 'Build disposable saved-input fixtures for real generation and on-disk reload acceptance.'
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'full-live-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.test.output.classesDirs) { exclude '**/FullRegistrationTestAgent*.class', '**/*TestTransform*.class' }
    from('src/fullAcceptanceHarness/resources')
    from({ configurations.testRuntimeClasspath.findAll {
        it.name.startsWith('junit-') || it.name.startsWith('opentest4j-') || it.name.startsWith('apiguardian-')
    }.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
}

// Disposable Stage 4 installed-service trace harness. It is intentionally a
// separate artifact so adding its probes cannot alter the frozen FULL probe.
tasks.register('stage4AcceptanceHarness', Jar) {
    description = 'Build the disposable Stage 4 scheduled-tick/event/tracking/save trace harness.'
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'stage4-acceptance-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.test.output.classesDirs) {
        include 'dev/phoenium/stage4/**'
        include 'dev/phoenium/stage4probe/**'
        include 'dev/phoenium/stage5probe/**'
        exclude 'dev/phoenium/stage4probe/Stage4TeleportTopologyTest*.class'
    }
    from('src/stage4AcceptanceHarness/resources')
}
tasks.register('prepareFullAcceptanceServer', Copy) {
    dependsOn tasks.named('prepareStage3ClientServer'), tasks.named('fullAcceptanceHarness')
    from(tasks.named('fullAcceptanceHarness'))
    into layout.buildDirectory.dir('stage3-client-server/mods')
}
tasks.named('runStage3FullAcceptance') { dependsOn tasks.named('prepareFullAcceptanceServer') }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

jar {
    from('LICENSE') {
        rename { _ -> 'LICENSE_phoenium' }
    }
}
