plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // Minecraft 26.2 is supplied to Loom as an already official-named, non-obfuscated artifact.
    // Calling officialMojangMappings() is rejected by Loom 1.17.20 in that environment.
    // Loom's non-obfuscated 26.2 mode does not create remap configurations.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    clientGameTest {
        java.srcDir 'src/clientGameTest/java'
        resources.srcDir 'src/clientGameTest/resources'

        // The client harness may inspect the live Phoenium runtime, but its output is
        // deliberately kept out of the main source set and therefore out of the
        // production server-only JAR.
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    clientGameTestImplementation.extendsFrom implementation
    clientGameTestRuntimeOnly.extendsFrom runtimeOnly
}

tasks.named('processClientGameTestResources') {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

def stage3ServerBase = file('.stage2-server-live1')

tasks.register('prepareStage3ClientServer', Sync) {
    description = 'Prepare an ignored, disposable external Fabric server for Stage 3 client evidence.'
    group = 'verification'
    dependsOn tasks.named('jar')
    into layout.buildDirectory.dir('stage3-client-server')
    from(stage3ServerBase) {
        include 'fabric-server-launch.jar'
        include '.fabric/**'
        include 'libraries/**'
        include 'versions/**'
        include 'mods/fabric-api-base.jar'
        include 'mods/fabric-lifecycle-events-v1.jar'
    }
    from(configurations.runtimeClasspath) {
        include '*fabric-command-api-v2*.jar'
        into 'mods'
    }
    from(tasks.named('jar')) {
        into 'mods'
    }
}

loom {
    runs {
        clientGameTest {
            client()
            name 'Phoenium Client GameTest'
            source sourceSets.clientGameTest
            runDir 'run/client-gametest'

            // Fabric Client GameTest is opt-in and discovers the isolated harness
            // entrypoint through the official fabric-client-gametest key.
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'

            // Development identity only. The dedicated test server is offline/local
            // and never consults a Microsoft account or launcher profile.
            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runClientGameTest'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/HARNESS-SMOKE-01.json').get().asFile.absolutePath
        }

        stage3ClientGameTest {
            client()
            name 'Phoenium Stage 3 Client GameTest'
            source sourceSets.clientGameTest
            runDir 'run/stage3-client-gametest'

            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=stage3'

            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3ClientGameTest'
            property 'phoenium.test.serverDirectory',
                    layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CLIENT.json').get().asFile.absolutePath
        }

        stage3FullAcceptance {
            client()
            name 'Phoenium authoritative FULL real-client acceptance'
            source sourceSets.clientGameTest
            runDir 'run/full-client-gametest'
            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=fullacceptance'
            programArg '--username'
            programArg 'PhoeniumTest0'
            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3FullAcceptance'
            property 'phoenium.test.serverDirectory', layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
        }

        stage3ChunkTrace {
            client()
            name 'Phoenium Stage 3 Chunk Runtime Trace'
            source sourceSets.clientGameTest
            runDir 'run/stage3-chunk-trace'

            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=chunktrace'

            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3ChunkTrace'
            property 'phoenium.test.serverDirectory',
                    layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-RUNTIME.json').get().asFile.absolutePath
            property 'phoenium.client.gametest.chunkTraceEvidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-RUNTIME.json').get().asFile.absolutePath
        }

        stage3ChunkReadinessTrace {
            client()
            name 'Phoenium Stage 3 Chunk Readiness Trace'
            source sourceSets.clientGameTest
            runDir 'run/stage3-chunk-readiness-trace'

            vmArg '-Dfabric.client.gametest'
            vmArg '-Dfabric.client.gametest.modid=phoenium-client-tests'
            vmArg '-Dphoenium.test.mode=chunkreadiness'

            programArg '--username'
            programArg 'PhoeniumTest0'

            property 'phoenium.test.username', 'PhoeniumTest0'
            property 'phoenium.test.minecraftVersion', minecraft_version
            property 'phoenium.test.javaVersion', '25'
            property 'phoenium.test.fabricLoaderVersion', loader_version
            property 'phoenium.test.fabricApiVersion', fabric_version
            property 'phoenium.test.loomVersion', loom_version
            property 'phoenium.test.gradleVersion', '9.5.1'
            property 'phoenium.test.gradleTask', 'runStage3ChunkReadinessTrace'
            property 'phoenium.test.serverDirectory',
                    layout.buildDirectory.dir('stage3-client-server').get().asFile.absolutePath
            property 'phoenium.test.serverAddress', '127.0.0.1:25565'
            property 'phoenium.test.rconPort', '25575'
            property 'phoenium.test.rconPassword', 'phoenium-stage3-client'
            property 'phoenium.client.gametest.evidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-READINESS.json').get().asFile.absolutePath
            property 'phoenium.client.gametest.chunkReadinessEvidence',
                    layout.buildDirectory.file('client-gametest/evidence/STAGE3-CHUNK-READINESS.json').get().asFile.absolutePath
        }
    }
}

tasks.named('runStage3ClientGameTest') {
    dependsOn tasks.named('prepareStage3ClientServer')
}

tasks.named('runStage3ChunkTrace') {
    dependsOn tasks.named('prepareStage3ClientServer')
}

tasks.named('runStage3ChunkReadinessTrace') {
    dependsOn tasks.named('prepareStage3ClientServer')
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

// Test-only adapter plumbing on original Minecraft classes, excluded from the production JAR.
def fullRegistrationTestAgent = tasks.register('fullRegistrationTestAgent', Jar) {
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'full-registration-test-agent.jar'
    destinationDirectory = layout.buildDirectory.dir('test-agent')
    from(sourceSets.test.output.classesDirs) { include '**/FullRegistrationTestAgent*.class' }
    manifest { attributes 'Premain-Class': 'dev.phoenium.chunk.FullRegistrationTestAgent' }
}
tasks.named('test') {
    dependsOn fullRegistrationTestAgent
    jvmArgumentProviders.add({ ["-javaagent:${fullRegistrationTestAgent.get().archiveFile.get().asFile.absolutePath}"] } as CommandLineArgumentProvider)
}

tasks.register('fullRegistrationHarness', Jar) {
    description = 'Build a disposable server-only registration fixture; never included in the production artifact.'
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'full-registration-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.test.output.classesDirs) { exclude '**/FullRegistrationTestAgent*.class', '**/FullRegistrationTestTransform*.class' }
    from('src/testHarness/resources')
    from({ configurations.testRuntimeClasspath.findAll {
        it.name.startsWith('junit-') || it.name.startsWith('opentest4j-') || it.name.startsWith('apiguardian-')
    }.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
}

tasks.register('fullAcceptanceHarness', Jar) {
    description = 'Build disposable saved-input fixtures for real generation and on-disk reload acceptance.'
    dependsOn tasks.named('compileTestJava')
    archiveFileName = 'full-live-probe.jar'
    destinationDirectory = layout.buildDirectory.dir('test-harness')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(sourceSets.test.output.classesDirs) { exclude '**/FullRegistrationTestAgent*.class', '**/*TestTransform*.class' }
    from('src/fullAcceptanceHarness/resources')
    from({ configurations.testRuntimeClasspath.findAll {
        it.name.startsWith('junit-') || it.name.startsWith('opentest4j-') || it.name.startsWith('apiguardian-')
    }.collect { zipTree(it) } }) { exclude 'META-INF/**', 'module-info.class' }
}
tasks.register('prepareFullAcceptanceServer', Copy) {
    dependsOn tasks.named('prepareStage3ClientServer'), tasks.named('fullAcceptanceHarness')
    from(tasks.named('fullAcceptanceHarness'))
    into layout.buildDirectory.dir('stage3-client-server/mods')
}
tasks.named('runStage3FullAcceptance') { dependsOn tasks.named('prepareFullAcceptanceServer') }

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': inputs.properties.version
    }
}

jar {
    from('LICENSE') {
        rename { _ -> 'LICENSE_phoenium' }
    }
}
